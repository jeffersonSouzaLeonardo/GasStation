spring.application.name=Manager

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.jpa.repositories.enabled=true
spring.jpa.generate-dll=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

tenants=manager

# prod, dev, test
spring.profiles.active=dev




# ######### MONITORAMENTO #########

#spring.jpa.show-sql=true
#spring.jpa.database=mysql

# Exibe detalhes do pool Hikari (bom para ver as URLs de conexao)
#logging.level.com.zaxxer.hikari=DEBUG

# Exibe a inicialização das fabricas de EntityManager do Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Actuator para Monitoramento dos BDs
management.endpoint.health.show-details=always